name: Update Google Scholar Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bibliometrics

      - name: Run bibliometrics
        env:
          SCHOLAR_ID: ${{ secrets.SCHOLAR_ID || 'DVFlCqoAAAAJ' }}
        run: python -m bibliometrics

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scholar-stats-dark.svg scholar-stats-light.svg bibliometrics.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "📊 Update Google Scholar stats [automated]"
            git push
          )
          
